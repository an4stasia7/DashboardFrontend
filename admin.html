<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель администратора</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body auth-body-wide">
    <main class="auth-card auth-card-wide">
      <header class="admin-topbar">
        <div>
          <h1>Панель администратора</h1>
          <p class="sub">Заявки на регистрацию и смену пароля</p>
        </div>
        <div class="admin-nav-actions">
          <a class="btn btn-ghost admin-back-link" href="dashboard.html">Назад</a>
          <button type="button" class="btn btn-primary" id="admin-refresh">Обновить</button>
        </div>
      </header>
      <div id="admin-error" class="auth-error" role="alert"></div>
      <section class="admin-grid" aria-label="Статистика заявок">
        <div class="admin-stat">
          <span>Ожидают решения</span>
          <strong id="stat-pending">0</strong>
        </div>
        <div class="admin-stat">
          <span>Регистрация</span>
          <strong id="stat-registration">0</strong>
        </div>
        <div class="admin-stat">
          <span>Смена пароля</span>
          <strong id="stat-reset">0</strong>
        </div>
      </section>
      <section class="admin-table-wrap" aria-label="Заявки пользователей">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Тип</th>
              <th>Логин</th>
              <th>Подразделение</th>
              <th>Создана</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="admin-requests-body">
            <tr><td colspan="6" class="admin-empty">Загрузка…</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/admin.js"></script>
  </body>
</html>
